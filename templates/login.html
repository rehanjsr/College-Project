<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinAssist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="header">
        <div>
            <h1>FinAssist</h1>
            <p>Your Personal Financial Assistant</p>
        </div>
        <span class="status">Login</span>
    </header>

    <main class="container" style="max-width: 450px; margin-top: 60px;">
        <section class="panel">
            <h2>Welcome Back</h2>
            <p class="muted">Log in to view your financial dashboard.</p>

            {% if error %}
                <p style="color: #ff4d4d; font-weight: bold; margin-top: 10px;">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" style="margin-top: 10px;">Log In</button>
            </form>

            <p style="margin-top: 20px; text-align: center;" class="muted">
                Don't have an account? <a href="{{ url_for('signup') }}" style="color: #6558d9; text-decoration: none; font-weight: bold;">Sign Up</a>
            </p>
        </section>
    </main>

</body>
</html>
